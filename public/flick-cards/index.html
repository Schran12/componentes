<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flick Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       CUSTOMISE — tweak colours and sizes here
       ═══════════════════════════════════════════════════════════════════════ */
    :root {
      /* Stage */
      --stage-bg: #050505;              /* main background */
      --stage-perspective: 1400px;      /* 3D depth of the deck */

      /* Card geometry */
      --card-aspect: 3 / 4.1;           /* portrait ratio */
      --card-width-min: 150px;
      --card-width-max: 380px;
      --card-width-fluid: min(30vw, 50vh);
      --card-radius: 14px;

      /* Typography */
      --font-ui: "Space Grotesk", system-ui, sans-serif;
      --font-mono: "Space Mono", ui-monospace, monospace;
      --name-weight: 500;
      --name-size-ratio: 0.13;          /* ~13% of card width */
      --cta-bg: rgba(12, 12, 12, 0.88);
      --cta-text: #f5f5f5;
      --cta-border: rgba(255, 255, 255, 0.12);

      /* Ambient glow behind deck */
      --glow-blur: 90px;
      --glow-opacity: 0.16;

      /* Navigation */
      --nav-size: 48px;
      --nav-bg: rgba(255, 255, 255, 0.06);
      --nav-hover: rgba(255, 255, 255, 0.14);
      --nav-color: rgba(255, 255, 255, 0.85);

      /* Timing (reference — JS uses same values) */
      --autoplay-ms: 3200;
      --flick-threshold-ratio: 0.22;
      --velocity-threshold: 0.5;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-ui);
      background: var(--stage-bg);
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;
      background: var(--stage-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: var(--stage-perspective);
      perspective-origin: 50% 50%;
      overflow: hidden;
      touch-action: pan-y;
    }

    .ambient {
      position: absolute;
      inset: -10%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient__layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(var(--glow-blur));
      opacity: 0;
      transform: scale(1.15);
      will-change: opacity;
    }

    .ambient__layer.is-active {
      opacity: var(--glow-opacity);
    }

    .deck {
      position: relative;
      width: clamp(
        var(--card-width-min),
        var(--card-width-fluid),
        var(--card-width-max)
      );
      aspect-ratio: var(--card-aspect);
      transform-style: preserve-3d;
      z-index: 2;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: var(--card-radius);
      overflow: hidden;
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
      backface-visibility: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }

    .card.is-dragging {
      cursor: grabbing;
    }

    .card:not([data-distance="0"]) {
      cursor: default;
      pointer-events: none;
    }

    .card__media {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      border-radius: inherit;
    }

    .card__shade {
      position: absolute;
      inset: 0;
      background: #000;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .card__content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(12px, 4vw, 28px) clamp(10px, 3.5vw, 22px);
      pointer-events: none;
      z-index: 2;
    }

    .card__name {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: var(--name-weight);
      line-height: 1.15;
      color: #fff;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transform: translateY(18px);
      width: 100%;
      padding-top: 8%;
    }

    .card[data-distance="0"] .card__name {
      opacity: 1;
      transform: translateY(0);
    }

    .card__cta {
      font-family: var(--font-mono);
      font-size: clamp(10px, 2.8vw, 13px);
      letter-spacing: 0.02em;
      padding: 0.65em 1.15em;
      border-radius: 999px;
      border: 1px solid var(--cta-border);
      background: var(--cta-bg);
      color: var(--cta-text);
      opacity: 0;
      transform: translateY(6px);
      margin-bottom: 4%;
      pointer-events: auto;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .card[data-distance="0"] .card__cta {
      opacity: 1;
      transform: translateY(0);
    }

    .card__cta:hover {
      background: rgba(28, 28, 28, 0.95);
    }

    .card:not([data-distance="0"]) .card__content {
      visibility: hidden;
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: var(--nav-size);
      height: var(--nav-size);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--nav-bg);
      color: var(--nav-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s ease, transform 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .nav:hover {
      background: var(--nav-hover);
      transform: translateY(-50%) scale(1.06);
    }

    .nav:active {
      transform: translateY(-50%) scale(0.96);
    }

    .nav--prev {
      left: clamp(12px, 3vw, 32px);
    }

    .nav--next {
      right: clamp(12px, 3vw, 32px);
    }

    .nav svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      :root {
        --nav-size: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card__shade {
        transition: none;
      }
      .card__cta {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Flick Cards product slider">
    <div class="ambient" id="ambient" aria-hidden="true">
      <div class="ambient__layer is-active" id="glowA"></div>
      <div class="ambient__layer" id="glowB"></div>
    </div>

    <div class="deck" id="deck"></div>

    <button type="button" class="nav nav--prev" id="btnPrev" aria-label="Previous product">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button type="button" class="nav nav--next" id="btnNext" aria-label="Next product">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <p class="sr-only" id="liveRegion" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      "use strict";

      const PRODUCTS = [
        {
          name: "Aurora Jacket",
          image: "https://images.unsplash.com/photo-1544022613-e87ca75a784a?w=800&q=80&auto=format&fit=crop"
        },
        {
          name: "Nova Sneaker",
          image: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=800&q=80&auto=format&fit=crop"
        },
        {
          name: "Orbit Bag",
          image: "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=800&q=80&auto=format&fit=crop"
        },
        {
          name: "Pulse Watch",
          image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800&q=80&auto=format&fit=crop"
        },
        {
          name: "Drift Cap",
          image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=800&q=80&auto=format&fit=crop"
        },
        {
          name: "Flux Tee",
          image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800&q=80&auto=format&fit=crop"
        }
      ];

      const COUNT = PRODUCTS.length;
      const Z_SLOT = 150;
      const MAX_VISIBLE = 3;

      const deckEl = document.getElementById("deck");
      const stageEl = document.getElementById("stage");
      const glowA = document.getElementById("glowA");
      const glowB = document.getElementById("glowB");
      const btnPrev = document.getElementById("btnPrev");
      const btnNext = document.getElementById("btnNext");
      const liveRegion = document.getElementById("liveRegion");

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const autoplayMs = reducedMotion ? 0 : 3200;

      let frontIndex = 0;
      let cardWidth = 280;
      let cardEls = [];
      let isAnimating = false;
      let autoplayTimer = null;
      let glowToggle = false;

      /** Signed circular distance from front: positive = behind/right in stack order */
      function wrapDistance(index, front) {
        let d = index - front;
        while (d > COUNT / 2) d -= COUNT;
        while (d < -COUNT / 2) d += COUNT;
        return d;
      }

      function sign(n) {
        return n === 0 ? 0 : n > 0 ? 1 : -1;
      }

      function getCardPose(d, w) {
        const ad = Math.abs(d);
        if (ad > MAX_VISIBLE) {
          return { hidden: true };
        }
        const sx = sign(d);
        const x = sx * Math.pow(ad, 0.7) * w * 0.52;
        const z = -ad * Z_SLOT;
        const y = ad * w * 0.015;
        const rotateY = -sx * Math.min(ad, MAX_VISIBLE) * 20;
        const rotateZ = sx * ad * 2.2;
        const scale = 1 - ad * 0.035;
        const zIndex = Math.round(20 - ad * 2);
        const shade = d === 0 ? 0 : Math.min(0.18 + ad * 0.2, 0.8);
        return {
          hidden: false,
          x,
          y,
          z,
          rotateX: 0,
          rotateY,
          rotateZ,
          scale,
          zIndex,
          shade,
          distance: d
        };
      }

      function applyPoseInstant(el, pose) {
        if (pose.hidden) {
          gsap.set(el, {
            visibility: "hidden",
            pointerEvents: "none"
          });
          return;
        }
        gsap.set(el, {
          visibility: "visible",
          x: pose.x,
          y: pose.y,
          z: pose.z,
          rotateX: pose.rotateX,
          rotateY: pose.rotateY,
          rotateZ: pose.rotateZ,
          scale: pose.scale,
          zIndex: pose.zIndex
        });
        el.dataset.distance = String(pose.distance);
        const shade = el.querySelector(".card__shade");
        if (shade) shade.style.opacity = String(pose.shade);
      }

      function measureCardWidth() {
        const rect = deckEl.getBoundingClientRect();
        cardWidth = rect.width || cardWidth;
        cardEls.forEach(function (el) {
          const idx = Number(el.dataset.index);
          const d = wrapDistance(idx, frontIndex);
          const nameEl = el.querySelector(".card__name");
          if (nameEl) {
            nameEl.style.fontSize = cardWidth * 0.13 + "px";
          }
        });
      }

      function layoutAll(instant) {
        measureCardWidth();
        cardEls.forEach(function (el) {
          const idx = Number(el.dataset.index);
          const d = wrapDistance(idx, frontIndex);
          const pose = getCardPose(d, cardWidth);
          if (instant || reducedMotion) {
            applyPoseInstant(el, pose);
          }
        });
      }

      function setAmbientImage(url, instant) {
        const next = glowToggle ? glowB : glowA;
        const prev = glowToggle ? glowA : glowB;
        next.style.backgroundImage = 'url("' + url + '")';
        if (instant || reducedMotion) {
          next.classList.add("is-active");
          prev.classList.remove("is-active");
          glowToggle = !glowToggle;
          return;
        }
        gsap.set(next, { opacity: 0 });
        next.classList.add("is-active");
        gsap.to(prev, {
          opacity: 0,
          duration: 0.55,
          ease: "power2.inOut",
          onComplete: function () {
            prev.classList.remove("is-active");
            gsap.set(prev, { clearProps: "opacity" });
          }
        });
        gsap.fromTo(
          next,
          { opacity: 0 },
          { opacity: 0.16, duration: 0.65, ease: "power2.inOut" }
        );
        glowToggle = !glowToggle;
      }

      function announce(name) {
        liveRegion.textContent = "Now showing " + name;
      }

      function buildDeck() {
        PRODUCTS.forEach(function (product, i) {
          const card = document.createElement("article");
          card.className = "card";
          card.dataset.index = String(i);
          card.setAttribute("role", "group");
          card.setAttribute("aria-label", product.name);

          const media = document.createElement("div");
          media.className = "card__media";
          media.style.backgroundImage = 'url("' + product.image + '")';

          const shade = document.createElement("div");
          shade.className = "card__shade";

          const content = document.createElement("div");
          content.className = "card__content";

          const name = document.createElement("h2");
          name.className = "card__name";
          name.textContent = product.name;

          const cta = document.createElement("button");
          cta.type = "button";
          cta.className = "card__cta";
          cta.textContent = "Get this product";

          content.appendChild(name);
          content.appendChild(cta);
          card.appendChild(media);
          card.appendChild(shade);
          card.appendChild(content);
          deckEl.appendChild(card);
          cardEls.push(card);
        });
      }

      function tweenCardToPose(el, pose, duration, delay, ease) {
        if (pose.hidden) {
          return gsap.to(el, {
            duration: reducedMotion ? 0 : duration,
            delay: reducedMotion ? 0 : delay,
            ease: ease,
            visibility: "hidden",
            pointerEvents: "none"
          });
        }
        const shade = el.querySelector(".card__shade");
        return gsap.to(el, {
          duration: reducedMotion ? 0 : duration,
          delay: reducedMotion ? 0 : delay,
          ease: ease,
          visibility: "visible",
          pointerEvents: pose.distance === 0 ? "auto" : "none",
          x: pose.x,
          y: pose.y,
          z: pose.z,
          rotateX: pose.rotateX,
          rotateY: pose.rotateY,
          rotateZ: pose.rotateZ,
          scale: pose.scale,
          zIndex: pose.zIndex,
          onUpdate: function () {
            el.dataset.distance = String(pose.distance);
          },
          onComplete: function () {
            el.dataset.distance = String(pose.distance);
            if (shade) shade.style.opacity = String(pose.shade);
          }
        });
      }

      function animateFrontContent(in) {
        const front = cardEls[frontIndex];
        if (!front) return;
        const nameEl = front.querySelector(".card__name");
        const ctaEl = front.querySelector(".card__cta");
        if (reducedMotion) {
          gsap.set(nameEl, { opacity: 1, y: 0 });
          gsap.set(ctaEl, { opacity: 1, y: 0 });
          return;
        }
        if (in) {
          gsap.fromTo(
            nameEl,
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power2.out", delay: 0.12 }
          );
          gsap.fromTo(
            ctaEl,
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", delay: 0.38 }
          );
        } else {
          gsap.set(nameEl, { opacity: 0, y: 18 });
          gsap.set(ctaEl, { opacity: 0, y: 6 });
        }
      }

      function flick(direction) {
        if (isAnimating) return;
        isAnimating = true;
        stopAutoplay();

        const nextFront =
          direction === 1
            ? (frontIndex + 1) % COUNT
            : (frontIndex - 1 + COUNT) % COUNT;

        const outgoing = frontIndex;
        const outgoingEl = cardEls[outgoing];
        const w = cardWidth;

        measureCardWidth();

        cardEls.forEach(function (el) {
          if (Number(el.dataset.index) !== outgoing) {
            const idx = Number(el.dataset.index);
            const d = wrapDistance(idx, frontIndex);
            if (d === 0) return;
            const nameEl = el.querySelector(".card__name");
            const ctaEl = el.querySelector(".card__cta");
            gsap.set(nameEl, { opacity: 0, y: 18 });
            gsap.set(ctaEl, { opacity: 0, y: 6 });
          }
        });

        const oldFrontName = outgoingEl.querySelector(".card__name");
        const oldFrontCta = outgoingEl.querySelector(".card__cta");
        gsap.to([oldFrontName, oldFrontCta], {
          opacity: 0,
          duration: reducedMotion ? 0 : 0.2,
          ease: "power2.in"
        });

        if (reducedMotion) {
          frontIndex = nextFront;
          cardEls.forEach(function (el) {
            const idx = Number(el.dataset.index);
            applyPoseInstant(el, getCardPose(wrapDistance(idx, frontIndex), cardWidth));
          });
          setAmbientImage(PRODUCTS[frontIndex].image, true);
          animateFrontContent(true);
          announce(PRODUCTS[frontIndex].name);
          isAnimating = false;
          startAutoplay();
          return;
        }

        const targetX = direction === 1 ? -w * 1.05 : w * 1.05;

        const tl = gsap.timeline({
          onComplete: function () {
            frontIndex = nextFront;
            cardEls.forEach(function (el) {
              const idx = Number(el.dataset.index);
              applyPoseInstant(el, getCardPose(wrapDistance(idx, frontIndex), cardWidth));
            });
            setAmbientImage(PRODUCTS[frontIndex].image, false);
            animateFrontContent(true);
            announce(PRODUCTS[frontIndex].name);
            isAnimating = false;
            startAutoplay();
          }
        });

        tl.to(outgoingEl, {
          x: targetX,
          y: -w * 0.06,
          rotateZ: direction === 1 ? -14 : 14,
          rotateY: direction === 1 ? 30 : -30,
          scale: 0.96,
          duration: 0.4,
          ease: "power3.out"
        }, 0);

        tl.add(function () {
          const newD = wrapDistance(outgoing, nextFront);
          const slotPose = getCardPose(newD, w);
          gsap.set(outgoingEl, { zIndex: slotPose.hidden ? 1 : slotPose.zIndex });
          if (slotPose.hidden) {
            gsap.set(outgoingEl, { visibility: "hidden", pointerEvents: "none" });
            return;
          }
          gsap.to(outgoingEl, {
            x: slotPose.x,
            y: slotPose.y,
            z: slotPose.z,
            rotateX: 0,
            rotateY: slotPose.rotateY,
            rotateZ: slotPose.rotateZ,
            scale: slotPose.scale,
            duration: 0.66,
            ease: "expo.out",
            onUpdate: function () {
              outgoingEl.dataset.distance = String(newD);
            },
            onComplete: function () {
              outgoingEl.dataset.distance = String(newD);
              const sh = outgoingEl.querySelector(".card__shade");
              if (sh) sh.style.opacity = String(slotPose.shade);
            }
          });
        }, 0.4);

        cardEls.forEach(function (el) {
          const idx = Number(el.dataset.index);
          if (idx === outgoing) return;
          const newD = wrapDistance(idx, nextFront);
          const pose = getCardPose(newD, w);
          const oldD = wrapDistance(idx, frontIndex);
          const steps = Math.abs(newD - oldD);
          const staggerAt = 0.4 + steps * 0.03;
          tweenCardToPose(el, pose, 0.95, staggerAt, "expo.out");
        });
      }

      function runIntro() {
        measureCardWidth();
        cardEls.forEach(function (el, i) {
          const idx = Number(el.dataset.index);
          const d = wrapDistance(idx, frontIndex);
          const pose = getCardPose(d, cardWidth);
          const tilt = (i % 2 === 0 ? 1 : -1) * 24;
          if (reducedMotion) {
            applyPoseInstant(el, pose);
            return;
          }
          gsap.set(el, {
            y: cardWidth * 1.4,
            rotateZ: tilt,
            rotateY: 0,
            x: 0,
            z: -400,
            scale: 0.85,
            visibility: "visible"
          });
          const delay = Math.max(0, MAX_VISIBLE - Math.min(Math.abs(d), MAX_VISIBLE)) * 0.07;
          gsap.to(el, {
            x: pose.x,
            y: pose.y,
            z: pose.z,
            rotateY: pose.rotateY,
            rotateZ: pose.rotateZ,
            scale: pose.scale,
            duration: 1.4,
            delay: delay,
            ease: "expo.out",
            onComplete: function () {
              el.dataset.distance = String(d);
              const sh = el.querySelector(".card__shade");
              if (sh) sh.style.opacity = String(pose.shade);
              gsap.set(el, { zIndex: pose.zIndex });
            }
          });
        });

        if (!reducedMotion) {
          gsap.delayedCall(1.4 + MAX_VISIBLE * 0.07 + 0.1, function () {
            animateFrontContent(true);
          });
        } else {
          animateFrontContent(true);
        }
      }

      /* ─── Drag interaction on front card ─── */
      let dragStartX = 0;
      let dragLastX = 0;
      let dragLastT = 0;
      let dragVelocity = 0;
      let dragActive = false;
      let dragEl = null;

      function getFrontEl() {
        return cardEls[frontIndex];
      }

      function onPointerDown(e) {
        if (isAnimating || reducedMotion) return;
        const el = getFrontEl();
        if (!el || e.target.closest(".card__cta")) return;
        if (wrapDistance(Number(el.dataset.index), frontIndex) !== 0) return;

        dragActive = true;
        dragEl = el;
        dragStartX = e.clientX;
        dragLastX = e.clientX;
        dragLastT = performance.now();
        dragVelocity = 0;
        el.classList.add("is-dragging");
        el.setPointerCapture(e.pointerId);
        stopAutoplay();
      }

      function onPointerMove(e) {
        if (!dragActive || !dragEl) return;
        const now = performance.now();
        const dx = e.clientX - dragStartX;
        const dt = Math.max(now - dragLastT, 1);
        dragVelocity = (e.clientX - dragLastX) / dt;
        dragLastX = e.clientX;
        dragLastT = now;

        const rotY = dx * 0.04;
        const rotZ = dx * 0.015;
        gsap.set(dragEl, {
          x: dx,
          rotateY: rotY,
          rotateZ: rotZ
        });
      }

      function onPointerUp(e) {
        if (!dragActive || !dragEl) return;
        const el = dragEl;
        dragActive = false;
        dragEl = null;
        el.classList.remove("is-dragging");
        try {
          el.releasePointerCapture(e.pointerId);
        } catch (_) {}

        const dx = e.clientX - dragStartX;
        const threshold = cardWidth * 0.22;
        const fast = Math.abs(dragVelocity) > 0.5;

        if (dx < -threshold || (fast && dragVelocity < 0)) {
          flick(1);
          return;
        }
        if (dx > threshold || (fast && dragVelocity > 0)) {
          flick(-1);
          return;
        }

        const pose = getCardPose(0, cardWidth);
        gsap.to(el, {
          x: pose.x,
          y: pose.y,
          rotateY: pose.rotateY,
          rotateZ: pose.rotateZ,
          duration: 0.55,
          ease: "elastic.out(1, 0.6)"
        });
        startAutoplay();
      }

      function startAutoplay() {
        if (reducedMotion || autoplayMs <= 0) return;
        stopAutoplay();
        autoplayTimer = window.setInterval(function () {
          if (!stageEl.matches(":hover") && !dragActive && !isAnimating) {
            flick(1);
          }
        }, autoplayMs);
      }

      function stopAutoplay() {
        if (autoplayTimer) {
          clearInterval(autoplayTimer);
          autoplayTimer = null;
        }
      }

      function init() {
        buildDeck();
        gsap.set(deckEl, { transformStyle: "preserve-3d" });
        cardEls.forEach(function (el) {
          gsap.set(el, { transformOrigin: "50% 50%", force3D: true });
        });

        layoutAll(true);
        setAmbientImage(PRODUCTS[0].image, true);
        announce(PRODUCTS[0].name);

        runIntro();
        startAutoplay();

        deckEl.addEventListener("pointerdown", onPointerDown);
        window.addEventListener("pointermove", onPointerMove);
        window.addEventListener("pointerup", onPointerUp);
        window.addEventListener("pointercancel", onPointerUp);

        btnNext.addEventListener("click", function () {
          flick(1);
        });
        btnPrev.addEventListener("click", function () {
          flick(-1);
        });

        window.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight") flick(1);
          if (e.key === "ArrowLeft") flick(-1);
        });

        window.addEventListener("resize", function () {
          if (!isAnimating) {
            layoutAll(true);
          }
        });

        stageEl.addEventListener("mouseenter", stopAutoplay);
        stageEl.addEventListener("mouseleave", startAutoplay);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
