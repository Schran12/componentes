<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iridescent Ring Pill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── CUSTOMISE ─────────────────────────────────────────
       --ink / --paper     page colours
       --pill-fill         translucent pill background
       --pill-line         hairline border
       --disc              dark icon disc
       --ring-thickness    masked outer rim (px)
       --orbit-duration    how fast the bright arc travels
       --hue-duration      how fast the spectrum shifts
    ─────────────────────────────────────────────────────── */
    :root {
      --ink: #0a0a0c;
      --paper: #eceaef;
      --pill-fill: rgba(255, 255, 255, 0.08);
      --pill-line: rgba(255, 255, 255, 0.18);
      --label: rgba(255, 255, 255, 0.92);
      --disc: #121218;
      --ring-thickness: 2.5px;
      --orbit-duration: 2.6s;
      --hue-duration: 7s;
      --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, #1a1524 0%, var(--ink) 70%);
      color: var(--label);
      font-family: var(--f-mono);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 9px 20px 9px 9px;
      border-radius: 999px;
      background: var(--pill-fill);
      border: 1px solid var(--pill-line);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }

    .pill:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .pill:focus-visible {
      outline: 2px solid #6ef0ff;
      outline-offset: 3px;
    }

    .pill:active {
      transform: scale(0.98);
    }

    .disc {
      position: relative;
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--disc);
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    /* Iridescent ring — masked conic gradient (hairline, not a filled disc) */
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      background: conic-gradient(
        from 0turn,
        transparent 0 58%,
        #ff6ea9 68%,
        #ffd36e 76%,
        #6ef0ff 84%,
        transparent 92%
      );
      -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - var(--ring-thickness)),
        #000 calc(100% - var(--ring-thickness))
      );
      mask: radial-gradient(
        farthest-side,
        transparent calc(100% - var(--ring-thickness)),
        #000 calc(100% - var(--ring-thickness))
      );
      /* Two animations, controlled separately on hover */
      animation:
        orbit var(--orbit-duration) linear infinite,
        hue var(--hue-duration) linear infinite;
    }

    .pill:hover .ring {
      /* Arc stops where it is; colour keeps cycling */
      animation-play-state: paused, running;
    }

    .disc svg {
      position: relative;
      z-index: 2;
      width: 14px;
      height: 14px;
      color: var(--label);
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      line-height: 1;
      padding-right: 2px;
    }

    @keyframes orbit {
      to { transform: rotate(1turn); }
    }

    @keyframes hue {
      to { filter: hue-rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring {
        animation: none;
        transform: rotate(42deg);
        filter: none;
      }
    }
  </style>
</head>
<body>
  <a class="pill" href="#explore" aria-label="Explore the drop">
    <span class="disc" aria-hidden="true">
      <span class="ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </span>
    <span class="label">Explore the drop</span>
  </a>
</body>
</html>
